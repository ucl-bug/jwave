[project]
name = "jwave"
version = "0.2.1"
description = "Fast and differentiable acoustic simulations in JAX."
readme = "README.md"
authors = [
    { name = "Antonio Stanziola", email = "stanziola.antonio@gmail.com" },
    { name = "Simon Arridge" },
    { name = "Ben T. Cox" },
    { name = "Bradley E. Treeby" },
]
license = "LGPL-3.0-only"
keywords = ["jax", "acoustics", "simulation", "ultrasound", "differentiable-programming"]
requires-python = ">=3.11"
dependencies = [
    "jaxdf>=0.2.8",
    "matplotlib>=3.0.0",
]
classifiers = [
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Environment :: GPU",
    "Environment :: GPU :: NVIDIA CUDA",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://ucl-bug.github.io/jwave/"
Repository = "https://github.com/ucl-bug/jwave"
"Bug Tracker" = "https://github.com/ucl-bug/jwave/issues"
Support = "https://discord.gg/VtUb4fFznt"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jwave"]

[dependency-groups]
dev = [
    "coverage>=7.2.7",
    "isort>=5.12.0",
    "mkdocs-jupyter>=0.24.1",
    "mkdocs-mermaid2-plugin>=0.6.0",
    "opencv-python>=4.7.0.72",
    "plumkdocs>=1.0.1",
    "pre-commit>=3.3.3",
    "pycln>=2.1.5",
    "pymdown-extensions>=10.0.1",
    "pytest>=7.2.0",
    "python-kacl>=0.4.6",
    "tqdm>=4.65.0",
]

[tool.isort]
src_paths = ["jwave", "tests"]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pycln]
all = true

[tool.mypy]
disallow_any_unimported = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
check_untyped_defs = true
show_error_codes = true
ignore_missing_imports = true
allow_redefinition = true

[tool.pytest.ini_options]
addopts = """\
    --doctest-modules\
"""

[tool.pytest_env]
CUDA_VISIBLE_DEVICES = ""

[tool.coverage.report]
exclude_lines = [
    'if TYPE_CHECKING:',
    'pragma: no cover'
]
